<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="60">
  <meta name="robots" content="noindex">
  <title>Down for maintenance</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #FAFAF9;
      --ink: #1C1C1A;
      --ink-muted: #6B6B66;
      --line: #E4E4E0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141413;
        --ink: #EDEDEA;
        --ink-muted: #9A9A94;
        --line: #2A2A27;
      }
    }

    * { box-sizing: border-box; margin: 0; }

    html, body { height: 100%; }

    body {
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      display: grid;
      justify-items: center;
      gap: 16px;
      max-width: 28rem;
      text-align: center;
    }

    svg { color: var(--ink-muted); }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    p {
      color: var(--ink-muted);
      line-height: 1.5;
    }

    small {
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--ink-muted);
      font-size: 0.8125rem;
    }
  </style>
</head>
<body>
  <main>
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="20" cy="20" r="17" />
      <path d="M20 10 V20 L26 24" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <h1>Down for maintenance</h1>
    <p>We're making some improvements and will be back shortly.</p>
    <small>This page reloads on its own.</small>
  </main>
</body>
</html>
